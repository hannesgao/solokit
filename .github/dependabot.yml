version: 2
updates:
  # The repo uses GitHub Actions; it has no package manifests (Node built-ins only).
  # The prefix makes PR titles Conventional Commits ("chore(deps): bump …"), which
  # the ci title check requires. No `groups`: a grouped PR takes its title from the
  # group name instead of the prefix.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
